<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #3 안내자 등장</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/timeline.js"></script>
  <div class="screen bg-fade" id="screen">
    <div class="milky-band"></div>
    <div class="guide-subtitle" id="subtitle"></div>
    <div class="page-index">#3 page3_guide_intro</div>
  </div>

  <script>
    // 시각은 영상 02의 재생 시각(ms). 값과 자막은 js/timeline.js의 TIMELINE.page3에서 조절한다.
    const T = TIMELINE.page3;
    const clock = UnitySync.clock(T.video, T.fallback);
    const FADE = 900;            // #4로 넘어가는 페이드 길이
    const LINES = T.lines;

    const subtitle = document.getElementById('subtitle');

    // 배경 연기 / 파티클 생성
    const screenEl = document.getElementById('screen');
    spawnSmoke(screenEl, 6, subtitle);
    spawnHaze(screenEl, 34, subtitle);

    showScreenNotes([
      { at: clock.sceneStart, text: '도착한 우주 공간. 신비로운 은하수가 떠 있고, 말하는 동안 음파처럼 일렁임' },
      ...cueNotes(LINES, '은하수의 대사'),
      { at: T.fadeOutAt, text: '대사가 끝나며 스크린이 어두워짐(페이드 아웃) · 태블릿 #4로 전환' },
    ], { videoStart: clock.sceneStart, total: T.fadeOutAt + FADE });

    // 마지막 자막은 따로 사라지지 않고 페이지 페이드 아웃과 함께 사라진다
    playSubtitlesAt(subtitle, LINES, clock);
    clock.at(T.fadeOutAt).then(() => goTo('page4_smoke_gate.html', FADE));
  </script>
</body>
</html>
