<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #10 별이 가져온 이야기</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: (#9에서 '다음' 직후, 영상 07) 카메라가 밤하늘에서 살짝 뒤로 빠지고, 흩어졌던 점술가가 다시 합쳐져 반듯하게 앉음
            → 화면 아래에서 카드가 올라와 점술가의 손으로 → (07_constellation_next_v2 끝, 13.3초) → 영상 12 대기 루프 (이야기를 들을지 기다림)
    태블릿: (#9에서 '다음'을 누르자마자 카드가 화면 위로 올라간 어두운 책상에서 끊김 없이 이어짐 = ?risen)
            → Unity가 영상 12에 들어가면 어두운 채 '별이 가져온 이야기 듣기' 버튼 → 누르면 story(영상 12 → 13)와 함께 #11
            (#9를 거치지 않고 열면 예전처럼 가운데 카드가 RISE_AT에 위로 올라가고, DIM_AT에 어두워진다)
    시연 후 '더 깊이 살펴보기' 단계(영상 08 대기 루프, deep 명령, 영상 09~11)는 없앴다.
  */
  .room-shade { opacity: 0; transition: opacity 1.2s ease-in-out; }
  .phase-dim .room-shade { opacity: 0.5; }

  /* #9에서 가운데로 돌아온 카드와 같은 위치 */
  .card-object.info-card {
    position: absolute;
    left: 790px;
    top: 242px;
    width: 340px;
    height: 480px;
  }

  #storyBtn { z-index: 2; }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/byeol-data.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/desk-video.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade"></div>
    <div class="card-object info-card" id="card"></div>
    <button class="btn btn-light reveal-btn" id="storyBtn">별이 가져온 이야기 듣기</button>
    <div class="page-index">#10 page10_star_story</div>
  </div>

  <script>
    // 시각은 영상 07의 재생 시각(ms). 값은 js/timeline.js의 TIMELINE.page10에서 조절한다.
    DeskVideo.attach();   // 책상 배경 영상 (js/desk-video.js). #11로 넘어가면 화면과 함께 빠진다
    const T = TIMELINE.page10;
    const clock = UnitySync.clock(T.video, T.fallback);
    const RISE_AT = T.riseAt; // 태블릿 카드가 위로 올라가기 시작 (= 스크린 아래에서 카드가 올라오기 시작)
    const RISE_MS = 1300;     // 카드가 올라가는 애니메이션 길이 (oracle.css cardRise)
    const DIM_AT = T.dimAt;   // 책상이 살짝 어두워짐

    lockInput();
    const screenEl = document.getElementById('screen');
    const card = document.getElementById('card');
    const visit = ByeolData.requireVisit();   // 카드 자리에 별자리 이름·한자만 (#9를 거치지 않고 열었을 때 보이는 카드)
    if (visit) ByeolData.fillCard(card, visit.profile);
    // #9의 '다음'으로 왔으면 카드는 이미 위로 올라갔고 책상도 어두운 상태 (#9의 desk-shade와 같은 0.5)
    const risen = /[?&]risen\b/.test(location.search);
    if (risen) {
      card.style.display = 'none';
      screenEl.querySelector('.room-shade').style.transition = 'none';
      screenEl.classList.add('phase-dim');
    }
    const btn = document.getElementById('storyBtn');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    async function play() {
      if (!risen) {
        clock.at(RISE_AT).then(() => card.classList.add('card-rise'));
        clock.at(DIM_AT).then(() => screenEl.classList.add('phase-dim'));
      }
      // Unity가 07을 끝까지 재생하고 12(대기 루프)로 넘어갔다고 알려 온 뒤에만 버튼이 뜬다 (08~11은 기다리지 않음)
      await Promise.all([wait(T.readyDelay), clock.reach(12)]);
      btn.disabled = false;
      btn.classList.add('revealed');
      unlockInput();
    }

    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.remove('revealed');
      lockInput();
      sendUnityAction('story');   // 영상 12 → 13 (한 번만: 위에서 버튼을 먼저 막는다)
      // 버튼은 스르륵 사라지고, 같은 (어두운) 책상 그대로 #11로 끊김 없이 이어진다
      setTimeout(() => goToInPlace('page11_fortune_select.html'), 900);
    });

    const storyAt = clock.noteTime(12, 0);
    showScreenNotes([
      { at: 0, text: '(#9에서 "다음" 직후, 영상 07) 밤하늘에 초점을 맞췄던 카메라가 살짝 뒤로 빠지고, 좌우로 흩어졌던 안개 점술가가 다시 합쳐져 뚜렷해짐 · 태블릿: 어두운 책상' },
      { at: RISE_AT, text: '화면 아래에서 카드가 올라옴' + (risen ? ' (태블릿 카드는 #9에서 "다음"을 누르자마자 이미 올라감)' : ' · 태블릿: 카드가 화면 위로 올라감') },
      { at: RISE_AT + RISE_MS, text: '카드가 점술가의 손에 들어감. 한쪽 손바닥 위에 카드를 똑바로 세워 올림' },
      { at: 13340, text: '영상 07(v2, 13.3초)이 끝나고 영상 12로 (08~11은 재생하지 않음)' },
      { at: storyAt, text: '영상 12 대기 루프 · 태블릿: "별이 가져온 이야기 듣기" 버튼 (누르면 영상 13, 태블릿 #11)' },
    ], { videoStart: clock.sceneStart, total: storyAt, waitInput: true });

    play();
  </script>
</body>
</html>
