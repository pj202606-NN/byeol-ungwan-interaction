<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #20 연기를 거슬러</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: 입장 때 따라왔던 연기의 흐름과 공간 이동을 거꾸로 감. 별운관 대문이 멀어지고, 머지않아 처음의 우주 공간으로 돌아옴
    태블릿: 입력 잠금, 연기·은하·파티클의 색과 밝기가 스크린 장면이 바뀔 때마다 약하게 따라 변함 (#4의 역순) → 자동으로 #21
    단계는 .screen에 붙는 phase-* 클래스로 전환되고, 시점은 아래 스크립트의 PHASES에서 조절한다.
  */
  .field {
    position: absolute;
    inset: 0;
    transform: scale(1);
    transition: transform 3s ease-in-out, filter 3s ease-in-out;
  }
  .tint {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease-in-out;
  }
  .tint-gold { background: radial-gradient(ellipse at 50% 50%, rgba(240,205,150,0.12) 0%, rgba(0,0,0,0) 60%); }
  .tint-violet { background: radial-gradient(ellipse at 50% 50%, rgba(150,120,200,0.14) 0%, rgba(40,30,80,0.08) 45%, rgba(0,0,0,0) 75%); }
  .tint-cool { background: radial-gradient(ellipse at 50% 45%, rgba(90,110,170,0.14) 0%, rgba(0,0,0,0) 70%); }

  /* 1. 대문이 멀어짐: 등 뒤에 남은 따뜻한 빛이 점점 작아짐 */
  .phase-gate .tint-gold { opacity: 1; }
  /* 2. 연기 흐름을 거슬러 뒤로: 시야가 조금씩 안쪽으로 모이며(멀어지는 느낌) 보랏빛 */
  .phase-flow .field { transform: scale(0.86); filter: brightness(1.15); transition-duration: 5s; }
  .phase-flow .tint-violet { opacity: 1; }
  /* 3. 처음의 우주 공간이 가까워짐: 차분한 푸른빛 */
  .phase-space .field { transform: scale(0.95); }
  .phase-space .tint-violet { opacity: 0.3; }
  .phase-space .tint-cool { opacity: 1; }
  /* 4. 우주 공간 도착: 제자리 */
  .phase-arrive .field { transform: scale(1); }
  .phase-arrive .tint-cool { opacity: 0.8; }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <div class="screen bg-fade" id="screen">
    <div class="field" id="field">
      <div class="milky-band"></div>
    </div>
    <div class="tint tint-gold"></div>
    <div class="tint tint-violet"></div>
    <div class="tint tint-cool"></div>
    <div class="page-index">#20 page20_reverse_flow</div>
  </div>

  <script>
    // 임시 구현: 스크린 영상이 나오면 각 단계의 at(ms) 값만 영상의 전환 시점에 맞추면 된다.
    const PHASES = [
      { at: 0,     name: 'gate',   screen: '별운관 대문 밖에서 대문이 점점 멀어짐 · 태블릿: 따뜻한 빛이 은은하게 남았다가 줄어듦' },
      { at: 2500,  name: 'flow',   screen: '입장 때 따라왔던 연기의 흐름을 거슬러 뒤로 이동 (#4의 역방향) · 태블릿: 시야가 조금씩 모이며 보랏빛' },
      { at: 7500,  name: 'space',  screen: '처음의 우주 공간(은하수가 음파처럼 일렁이던 곳)이 가까워짐 · 태블릿: 차분한 푸른빛' },
      { at: 10000, name: 'arrive', screen: '우주 공간으로 돌아옴' },
    ];
    const NEXT_AT = 11500;      // #21로 이어짐

    lockInput();
    const field = document.getElementById('field');
    spawnSmoke(field, 6);
    spawnHaze(field, 30);

    const screenEl = document.getElementById('screen');
    PHASES.forEach((phase) => {
      setTimeout(() => {
        PHASES.forEach((p) => screenEl.classList.remove('phase-' + p.name));
        screenEl.classList.add('phase-' + phase.name);
      }, phase.at);
    });
    setTimeout(() => goToInPlace('page21_door_exit.html', { crossfade: 1200 }), NEXT_AT);

    showScreenNotes([
      ...PHASES.map((p) => ({ at: p.at, text: p.screen })),
      { at: NEXT_AT, text: '태블릿 #21로 이어짐' },
    ], { total: NEXT_AT });
  </script>
</body>
</html>
