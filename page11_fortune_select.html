<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #11 별 이야기 시기 선택</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: (#10에서 버튼 직후) 점술가가 손 위에 띄워둔 카드를 움켜쥐듯 손을 모음 → 한 손으로 화면 아래쪽에 안개를 뿌리듯 펼침(카드는 사라짐)
            → 점술가가 양손을 다시 모았다가 어깨 너비로 펼침, 그 사이에 별자리·별빛이 안개와 함께 깜빡임 (카드를 고를 때까지 루프)
    태블릿: (#10의 어두운 책상에서 끊김 없이 이어짐) 안개가 아래로 뿌려지는 순간 밝아지며 위에서 카드 3장이 내려옴
            → 안내 문구가 뜨고 카드 선택 가능 → 고른 카드의 시기(오늘/이달/올해)를 저장하고 #12로
  */
  .room-shade { opacity: 0.5; transition: opacity 1.5s ease-in-out; }
  .phase-drop .room-shade { opacity: 0; }

  /* 카드 3장과 안내 문구는 각자 차례가 오기 전까지 숨겨 둔다 */
  .fortune-cards { visibility: hidden; }
  .phase-drop .fortune-cards { visibility: visible; }
  .fortune-cards .card-object { cursor: pointer; }
  .select-caption {
    margin-bottom: 0;
    z-index: 2;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .phase-ready .select-caption { opacity: 1; }
  /* #12에서 '뒤로가기'로 돌아온 경우: 카드가 이미 내려와 있는 상태로 바로 보여준다 */
  .skip-intro .card-object,
  .skip-intro .select-caption,
  .skip-intro .room-shade { animation: none !important; transition: none !important; }

  .fortune-cards {
    display: flex;
    align-items: center;
    /* 카드 가운데 사이 간격은 예전 사다리꼴 카드와 같게(450px): 카드 폭 214 + gap 236 */
    gap: 236px;
    margin-bottom: 130px;
    z-index: 2;
  }
  /* 세 카드 모두 공통 뒷면 이미지(assets/cards/card_back.jpg, 1748×3591)를 원본 비율 그대로 (2026-11-16, 예전 회색 사다리꼴 대신).
     폭 214px, 높이 459px: #8~#10 카드(css/oracle.css .card-art)와 같은 기준으로 좌우 4% · 위아래 2%씩 잘라 낸 비율 (2026-11-19, 예전 469px).
     슬롯(.card-slot-1/3)은 그대로 두어 클릭 영역과 구조를 유지한다 */
  .card-slot-1, .card-slot-3 {
    position: relative;
    width: 214px;
    height: 459px;
  }
  .fortune-cards .card-object {
    position: relative;
    width: 214px;
    height: 459px;   /* 214 ÷ (0.92 × 1748) × (0.96 × 3591) */
    /* 다른 카드와 같이 그림만 확대: 폭 기준 좌우 4%씩 잘라 내는 크기 = 100% / 0.92. 높이 459px라 위아래는 약 2%씩 잘린다 */
    background: transparent;
    isolation: isolate;
    border-radius: var(--card-radius);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    /* 제목: 카드 가운데 원 위에 (예전 16px → 18px). 뒷면 무늬가 비치도록 글자만, 바탕 상자는 두지 않는다 */
    font-size: calc(18px * var(--ui));
    font-family: 'BonMyeongjo', 'Malgun Gothic', serif;
    color: #fff8e7;   /* 밝은 백금색: 카드 배경의 밝기와 독립적으로 유지 */
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.6);
    white-space: nowrap;
  }
  /* 카드마다 살짝 다른 각도. 내려오는 애니메이션이 transform(translateY)을 쓰므로 겹치지 않는 rotate 속성으로 기울인다 */
  .fortune-cards .card-shape-1 { rotate: -4deg; }
  .fortune-cards .card-shape-3 { rotate: 4deg; }
  /* 카드 그림만 어둡게 하여 백금색 글씨는 밝게 유지한다. */
  .fortune-cards .card-object::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: url('assets/cards/card_back.jpg') center / calc(100% / 0.92) no-repeat;
    filter: brightness(0.7);
    transition: filter 0.35s ease;
  }
  .fortune-cards .card-object.picked::before { filter: brightness(1); }

  /* 생년월일 입력 페이지의 종이(paper-drop)와 같은 방식으로,
     최종 정지 상태를 애니메이션의 to 키프레임에 그대로 넣어
     위에서 부드럽게 떨어져 내려오게 한다. 카드마다 살짝 시차를 준다. */
  @keyframes cardDrop {
    from { transform: translateY(-140%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .phase-drop .card-shape-1 { animation: cardDrop 1.3s cubic-bezier(.22,.61,.36,1) 0s both; }
  .phase-drop .card-shape-3 { animation: cardDrop 1.3s cubic-bezier(.22,.61,.36,1) 0.24s both; }
  .phase-drop .fortune-card:nth-child(2) {
    animation: cardDrop 1.3s cubic-bezier(.22,.61,.36,1) 0.12s both;
  }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/timeline.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade"></div>
    <div class="fortune-cards">
      <div class="card-slot-1">
        <div class="card-object card-shape-1" data-period="today">오늘의 별 이야기</div>
      </div>
      <div class="card-object fortune-card" data-period="month">이달의 별 이야기</div>
      <div class="card-slot-3">
        <div class="card-object card-shape-3" data-period="year">올해의 별 이야기</div>
      </div>
    </div>
    <div class="subtitle text-light select-caption">듣고 싶은 이야기의 시기를 선택해 주세요</div>
    <div class="page-index">#11 page11_fortune_select</div>
  </div>

  <script>
    // 타이밍 (단위: ms) - 스크린 영상이 나오면 이 값들만 영상에 맞추면 된다.
    const FLING_AT = 900;      // 스크린: 모았던 손을 화면 아래쪽으로 뿌리듯 펼치기 시작
    const DROP_AT = 1700;      // 안개가 화면 아래로 뿌려지는 순간: 태블릿이 밝아지며 카드 3장이 내려옴 (시연 후 0.5초 앞당김, 예전 2200)
    const DROP_MS = 1540;      // 카드 3장이 다 내려오는 시간 (1.3초 + 마지막 카드 시차 0.24초)
    const CAPTION_DELAY = 400; // 카드가 다 내려온 뒤 안내 문구가 뜨기까지
    const CAPTION_AT = DROP_AT + DROP_MS + CAPTION_DELAY;

    // 카드 선택은 Unity가 영상 14(시기 선택 대기 루프)에 들어간 뒤부터 (js/timeline.js의 TIMELINE.page11)
    const T = TIMELINE.page11;
    const clock = UnitySync.clock(T.video, T.fallback);

    const screenEl = document.getElementById('screen');
    // #12의 '뒤로가기' 버튼으로 돌아온 경우에만 선택 화면부터 (테스트 도구의 '← 이전'은 처음부터)
    const backFromNext = /[?&]ready\b/.test(location.search);
    if (backFromNext) {
      screenEl.classList.add('skip-intro', 'phase-drop', 'phase-ready');
    } else {
      lockInput();
      setTimeout(() => screenEl.classList.add('phase-drop'), DROP_AT);
      Promise.all([new Promise((r) => setTimeout(r, CAPTION_AT)), clock.reach(14)]).then(() => {
        screenEl.classList.add('phase-ready');
        unlockInput();
      });
    }

    // 카드 선택: 고른 시기를 저장해 두고 #12로. Unity에는 period(영상 14 → 15)를 보낸다
    // (#12에서 뒤로 와서 다시 고른 경우 Unity는 이미 지나간 명령으로 보고 무시하므로 영상은 그대로)
    const PICK_HOLD = 550;   // 누른 카드가 원래 밝기로 보이는 시간 (그 뒤 #12로)
    let picked = false;
    document.querySelectorAll('.fortune-cards [data-period]').forEach((card) => {
      card.addEventListener('click', () => {
        if (picked) return;
        picked = true;
        try { sessionStorage.setItem('fortunePeriod', card.dataset.period); } catch (e) {}
        sendUnityAction('period');
        lockInput();
        card.classList.add('picked');
        setTimeout(() => goTo('page12_keyword_select.html'), PICK_HOLD);
      });
    });

    if (backFromNext) showScreenNotes([
      { at: 0, text: '(#12에서 뒤로가기) 루프: 펼친 손 사이에서 별자리·별빛이 반짝임. 관람객이 카드를 고를 때까지 반복 · 태블릿: 카드 3장이 내려와 있는 선택 화면' },
    ]);
    else showScreenNotes([
      { at: -900, text: '(#10에서 버튼 직후) 점술가가 손바닥 위에 띄워둔 카드를 움켜쥐듯 손을 한 번 모음' },
      { at: FLING_AT, text: '모은 손을 화면 아래쪽을 향해 한 손으로 뿌리듯 스르륵 펼침. 손 안의 카드는 자연스럽게 사라져 있고, 뿌려지는 것은 신비한 안개' },
      { at: DROP_AT, text: '안개가 화면 아래로 뿌려짐 · 태블릿: 밝아지며 위에서 카드 3장(오늘/이달/올해의 별의 이야기)이 내려옴' },
      { at: CAPTION_AT, text: '점술가가 양손을 다시 모았다가 어깨 너비로 쭉 펼침. 그 사이에서 별자리·별빛이 안개와 함께 깜빡이며 빛남 · 태블릿: "듣고 싶은 이야기의 시기를 선택해 주세요" 안내가 뜨고 카드 선택 가능' },
      { at: CAPTION_AT + 2500, text: '루프: 펼친 손 사이에서 별자리·별빛이 반짝임. 관람객이 카드를 고를 때까지 반복 (고르면 #12로)' },
    ], { total: CAPTION_AT, waitInput: true });
  </script>
</body>
</html>
