<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #15 오늘의 이야기</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: (#14 '이야기 마치기' 직후) 운세 색·밝기를 띠던 별자리가 본래의 밝은 빛으로 → 점술가가 손을 내리고 별빛·운세 요소가 가장자리로 퍼짐
            (카메라 초점: 별자리 → 점술가, 창밖 밤하늘에는 관람객의 별자리가 반짝임) → 퍼진 요소가 점술가 쪽 중앙으로 모임
            → 연기가 일렁이고 별빛이 반짝이는 루프 ('다음'을 누를 때까지)
    태블릿: (#14의 어두운 책상에서 끊김 없이 이어짐) 어두운 책상, 입력 잠금 + 점술가의 나래이션 자막 (씬 약 7초부터)
            → 씬 약 23초에 어두운 책상 위로 운세 총정리 화면이 스르륵 나타남
            → Unity가 영상 20(대기 루프)에 들어가면 '다음' 버튼이 뜨고, 누르면 summary_next(영상 20 → 21)와 함께 #16
  */
  /* #14와 같은 어두운 책상(.room-shade 0.55)으로 시작해 총정리 화면이 떠 있는 동안에도 어두운 채 #16으로 이어진다 */
  .room-shade { opacity: 0.55; }

  .dashboard-layout,
  #nextBtn {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.22,.61,.36,1);
  }
  .phase-show .dashboard-layout { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
  /* '다음'은 누를 수 있게 된 순간에만 보인다 (보이는데 잠겨 있어 터치가 무시되는 일이 없도록) */
  .phase-next #nextBtn { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  #nextBtn {
    position: absolute;
    left: 50%;
    bottom: 70px;
    transform: translate(-50%, 16px);
    z-index: 2;
    pointer-events: none;
  }
  .phase-exit .dashboard-layout,
  .phase-exit #nextBtn { opacity: 0; transition-delay: 0s; pointer-events: none; }

  /* 어두운 책상 위의 흰 글씨 */
  .dashboard-layout .card-object,
  .dashboard-layout .label,
  .name-box,
  .mood-tag,
  .dashboard-card { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.75); }
  .mood-tag,
  .dashboard-card { border-color: rgba(255,255,255,0.45); }

  .guide-subtitle {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    margin: 0 auto;
    transform: translateY(-50%);
    z-index: 3;
  }

  .dash-left {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .dash-right {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .name-box {
    width: 460px;
    min-height: 52px;
    border: 1px solid var(--color-border);
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .label {
    font-size: 16px;
    color: var(--color-muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/subtitles.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade"></div>
    <div class="dashboard-layout" style="margin-bottom:40px;">
      <div class="dash-left">
        <div class="card-object" style="width:260px; height:340px;">별자리 이미지</div>
        <div class="mood-tag">오늘의 기운: 천운</div>
      </div>
      <div class="dash-right">
        <div class="label" style="margin-top:0;">별자리 이름</div>
        <div class="name-box"></div>
        <div class="label">소속 사신수</div>
        <div class="label">상징 동물</div>
        <div class="label" style="margin-bottom:16px;">성격 키워드</div>
        <div class="dashboard-cards">
          <div class="dashboard-card">오늘의 운세 요약</div>
          <div class="dashboard-card">이달의 운세 요약</div>
          <div class="dashboard-card">올해의 운세 요약</div>
        </div>
      </div>
    </div>
    <button class="btn btn-light" id="nextBtn">다음</button>
    <div class="guide-subtitle" id="subtitle"></div>
    <div class="page-index">#15 page15_dashboard</div>
  </div>

  <script>
    // 시각은 영상 19(총정리 도입)의 재생 시각(ms). 값과 자막은 js/timeline.js의 TIMELINE.page15에서 조절한다.
    // 총정리 화면은 SHOW_AT(씬 약 23초)에, '다음'은 그 뒤 Unity가 영상 20(대기 루프)에 들어가야 뜬다
    const T = TIMELINE.page15;
    const clock = UnitySync.clock(T.video, T.fallback);
    const SPREAD_AT = 0;         // 스크린: 점술가가 손을 내리고 별빛·운세 요소가 가장자리로 퍼짐, 카메라 초점이 점술가로

    // 점술가 나래이션: 두 번째 대사("정리해 드리겠습니다")와 함께 퍼진 요소가 중앙으로 모이기 시작한다
    const LINES = T.lines;
    const GATHER_AT = LINES[1].at;   // 스크린: 퍼진 요소가 점술가 쪽 중앙으로 모이기 시작
    const SHOW_AT = T.showAt;        // 총정리 화면이 나타나는 시각
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    lockInput();
    const screenEl = document.getElementById('screen');
    const nextBtn = document.getElementById('nextBtn');
    playSubtitlesAt(document.getElementById('subtitle'), LINES, clock);
    const shown = clock.at(SHOW_AT).then(() => {
      screenEl.classList.add('phase-show');
      console.info('[#15] 총정리 화면 표시');
    });
    // '다음'은 총정리 화면이 다 나타나고(nextDelay) Unity가 영상 20에 들어간 뒤에야 보이고 눌린다.
    // (영상 19 도중에 눌러도 Unity가 20에 들어가는 순간 21로 넘어가지만, 화면과 영상이 맞도록 20을 기다린다)
    Promise.all([shown.then(() => wait(T.nextDelay)), clock.reach(20)]).then(() => {
      screenEl.classList.add('phase-next');
      unlockInput();
      const s = UnitySync.state();
      console.info('[#15] "다음" 활성화 · Unity', s ? '영상 ' + s.video : (UnitySync.enabled() ? '미연결(타이머로 진행)' : '동기화 끔'));
    });

    // 다음: 총정리 화면이 스르륵 사라지고, 같은 책상 그대로 #16으로 끊김 없이 이어진다
    const EXIT_MS = 1200;
    let advanced = false;
    nextBtn.addEventListener('click', () => {
      if (advanced) return;
      if (inputLocked) { console.warn('[#15] "다음"이 아직 잠겨 있어 무시함 (영상 20 대기 중)'); return; }
      advanced = true;
      console.info('[#15] "다음" 클릭 → summary_next 전송, #16으로');
      sendUnityAction('summary_next');   // 영상 20 → 21 (한 번만)
      lockInput();
      screenEl.classList.add('phase-exit');
      setTimeout(() => goToInPlace('page16_gift_card.html'), EXIT_MS);
    });

    showScreenNotes([
      { at: -650, text: '(#14에서 "이야기 마치기" 직후, 영상 19) 관람객의 운세 색·밝기를 띠던 별자리 그래픽이 본래의 밝은 빛으로 돌아감 · 태블릿: #14의 요소가 스르륵 사라짐' },
      { at: SPREAD_AT, text: '점술가가 손을 자연스럽게 내리며, 별빛과 운세 요소가 화면 가장자리로 은은하게 퍼짐. 카메라 초점이 별자리에서 점술가로 부드럽게 옮겨감 (등 뒤 창밖 밤하늘에는 관람객의 별자리와 별빛이 반짝임) · 태블릿: 어두운 책상, 입력 잠금' },
      ...cueNotes(LINES, '점술가 나래이션').map((n, i) => (i === 1
        ? { at: n.at, text: n.text + ' · 퍼졌던 별빛과 운세 요소가 점술가의 몸·손이 있는 중앙으로 자연스럽게 모여듦' }
        : { at: n.at, text: n.text + ' · 태블릿: 어두운 책상 위 자막' })),
      { at: SHOW_AT, text: '중앙으로 다 모임 · 태블릿: 어두운 책상 위로 운세 총정리 화면이 나타남' },
      { at: clock.noteTime(20, 0), text: '영상 20 루프: 연기가 일렁이고 별빛이 반짝임 · 태블릿: "다음" 버튼 (총정리가 뜨고 2초가 지나야. 누르면 영상 21, 태블릿 #16)' },
    ], { videoStart: clock.sceneStart, total: clock.noteTime(20, 2000), waitInput: true });
  </script>
</body>
</html>
