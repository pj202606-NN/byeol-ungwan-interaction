<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #15 오늘의 이야기</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: (#14 '이야기 마치기' 직후) 운세 색·밝기를 띠던 별자리가 본래의 밝은 빛으로 → 점술가가 손을 내리고 별빛·운세 요소가 가장자리로 퍼짐
            (카메라 초점: 별자리 → 점술가, 창밖 밤하늘에는 관람객의 별자리가 반짝임) → 퍼진 요소가 점술가 쪽 중앙으로 모임
            → 연기가 일렁이고 별빛이 반짝이는 루프 ('다음'을 누를 때까지)
    태블릿: (#14의 어두운 책상에서 끊김 없이 이어짐) 어두운 책상, 입력 잠금 + 점술가의 나래이션 자막 (씬 약 7초부터)
            → 씬 약 20.5초에 어두운 책상 위로 운세 총정리 화면이 스르륵 나타남
            → Unity가 영상 20(대기 루프)에 들어가면 '다음' 버튼이 뜨고, 누르면 summary_next(영상 20 → 21)와 함께 #16
  */
  /* #14와 같은 어두운 책상(.room-shade 0.55)으로 시작해 총정리 화면이 떠 있는 동안에도 어두운 채 #16으로 이어진다 */
  .room-shade { opacity: 0.55; }

  .dashboard-layout,
  #nextBtn {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.22,.61,.36,1);
  }
  .phase-show .dashboard-layout { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
  /* '다음'은 누를 수 있게 된 순간에만 보인다 (보이는데 잠겨 있어 터치가 무시되는 일이 없도록) */
  .phase-next #nextBtn { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  #nextBtn {
    position: absolute;
    left: 50%;
    bottom: 110px;
    transform: translate(-50%, 16px);
    z-index: 2;
    pointer-events: none;
  }
  .phase-exit .dashboard-layout,
  .phase-exit #nextBtn { opacity: 0; transition-delay: 0s; pointer-events: none; }

  /* 어두운 책상 위의 흰 글씨 */
  .dashboard-layout .card-object,
  .mood-tag,
  .dashboard-card { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.75); }
  .mood-tag,
  .dashboard-card { border-color: rgba(255,255,255,0.45); }

  /* (2026-11-19) 왼쪽: #8과 같은 크기의 카드(자리 340×480 → 그림 약 248×532)와, 그 그림 폭에 맞춘 '오늘의 기운' */
  .dash-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(20px + 26px);   /* 그림이 카드 자리보다 위아래로 약 26px씩 나오므로 그만큼 띄운다 */
  }
  .dash-left .mood-tag {
    width: calc(480px * 1.108 * 0.92 * 1748 / (0.96 * 3591));   /* = 카드 그림 폭 (css/oracle.css .card-art와 같은 계산) */
    margin-top: 0;
    transform: translateY(24px);   /* 카드와 다른 상자 위치는 유지하고 오늘의 기운만 아래로 */
    box-sizing: border-box;
    text-align: center;
    background: rgba(0,0,0,0.45);   /* 옆의 세 이야기 상자(.dashboard-card)와 같은 바탕 */
  }
  .dash-right {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }
  /* 항목 이름('별자리 이름' '소속 사신수' …)은 값보다 어둡게 */
  .dash-key { color: rgba(255,255,255,0.5); text-shadow: 0 1px 4px rgba(0,0,0,0.75); }
  .label { font-size: calc(16px * var(--ui)); }
  /* 별자리 이름: #9와 같은 크기의 본명조, 상자 없이. 옆의 한자 표기도 #9처럼 '정수 · 井' */
  .dash-name { margin: calc(6px * var(--ui)) 0 calc(22px * var(--ui)); color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.75), 0 0 14px rgba(0,0,0,0.5); }
  #dashName { font-family: 'BonMyeongjo', "Pretendard", "Malgun Gothic", sans-serif; font-size: calc(32px * var(--ui)); }
  .dash-hanja { margin-left: 14px; font-size: calc(22px * var(--ui)); opacity: 0.8; }
  /* 사신수·동물·키워드: #9처럼 항목 이름 칸을 같은 폭으로 두고 값은 그 오른쪽에서 왼쪽 정렬 */
  .dash-row { display: flex; gap: 20px; text-align: left; font-size: calc(18px * var(--ui)); line-height: 1.5; margin-bottom: calc(10px * var(--ui)); }
  .dash-row .dash-key { flex: 0 0 calc(104px * var(--ui)); }
  .dash-row .dash-val { flex: 1; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.75); word-break: keep-all; }
  .dashboard-cards { margin-top: calc(34px * var(--ui)); }   /* 세 상자를 조금 아래로 (예전 14px) */
  .dashboard-card {
    flex-direction: column;
    justify-content: flex-start;
    gap: 0;
    padding: calc(56px * var(--ui)) calc(22px * var(--ui)) calc(8px * var(--ui));   /* 상자 크기·위치는 고정, 내부 글만 16px 아래로 */
  }
  .dashboard-card > * { position: relative; top: 16px; }   /* 박스는 고정하고 제목·구분선·본문만 함께 조금 더 아래로 */
  .dash-card-title { font-size: calc(17px * var(--ui)); color: #fff; }
  /* 제목 아래 짧은 금색 구분선, 그 아래 종합 이야기(본명조) */
  .dash-card-rule { width: calc(40px * var(--ui)); height: 1px; margin: calc(22px * var(--ui)) auto; background: var(--card-gold); }
  .dash-card-text { font-family: 'BonMyeongjo', 'Malgun Gothic', serif; font-size: calc(15px * var(--ui)); line-height: 1.7; color: #fff; text-align: justify; text-align-last: left; letter-spacing: normal; word-break: normal; line-break: strict; }   /* 양쪽 정렬, 자간은 그대로. 낱말 단위로만 줄을 바꾸면(keep-all) 빈칸이 크게 벌어져 한국어 기본 줄바꿈으로 */
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/byeol-data.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/subtitles.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade"></div>
    <div class="dashboard-layout" style="margin-bottom:40px;">
      <div class="dash-left">
        <div class="card-object" id="dashCard" style="width:340px; height:480px;"></div>
        <div class="mood-tag">오늘의 기운: <span id="dashFlow"></span></div>
      </div>
      <div class="dash-right">
        <div class="label dash-key">별자리 이름</div>
        <div class="dash-name"><span id="dashName"></span><span class="dash-hanja" id="dashHanja"></span></div>
        <div class="dash-row"><span class="dash-key">소속 사신수</span><span class="dash-val" id="dashSashin"></span></div>
        <div class="dash-row"><span class="dash-key">상징 동물</span><span class="dash-val" id="dashAnimal"></span></div>
        <div class="dash-row"><span class="dash-key">성격 키워드</span><span class="dash-val" id="dashKeywords"></span></div>
        <div class="dashboard-cards">
          <div class="dashboard-card" data-period="today"><div class="dash-card-title">오늘의 별 이야기</div><div class="dash-card-rule"></div><div class="dash-card-text"></div></div>
          <div class="dashboard-card" data-period="month"><div class="dash-card-title">이달의 별 이야기</div><div class="dash-card-rule"></div><div class="dash-card-text"></div></div>
          <div class="dashboard-card" data-period="year"><div class="dash-card-title">올해의 별 이야기</div><div class="dash-card-rule"></div><div class="dash-card-text"></div></div>
        </div>
      </div>
    </div>
    <button class="btn btn-light" id="nextBtn">다음</button>
    <div class="page-index">#15 page15_dashboard</div>
  </div>

  <script>
    // 시각은 영상 19(총정리 도입)의 재생 시각(ms). 값과 자막은 js/timeline.js의 TIMELINE.page15에서 조절한다.
    // 총정리 화면은 SHOW_AT(씬 약 20.5초)에, '다음'은 그 뒤 Unity가 영상 20(대기 루프)에 들어가야 뜬다
    // 총정리: 관람객이 어느 시기·주제를 골랐든, 같은 별자리 ID로 오늘·이달·올해 세 기간의 '종합' 간략을 모두 보여 준다.
    // 오늘의 기운 = 오늘 · 종합의 '운세 흐름' 값 그대로 (길·보통·주의). 다른 등급을 만들지 않는다.
    (function fillDashboard() {
      const visit = ByeolData.requireVisit();
      if (!visit) return;
      const p = visit.profile;
      ByeolData.fillCard(document.getElementById('dashCard'), p);
      document.getElementById('dashName').textContent = p.name;
      const mm = /^(.+)\((.+)\)$/.exec(p.mansion);   // '정(井)' → '정수 · 井' (#9와 같은 표기, 데이터는 그대로)
      document.getElementById('dashHanja').textContent = mm ? mm[1] + '수 · ' + mm[2] : p.mansion;
      document.getElementById('dashSashin').textContent = p.sashin;
      document.getElementById('dashAnimal').textContent = p.animal;
      document.getElementById('dashKeywords').textContent = p.keywords.join(' · ');
      document.querySelectorAll('.dashboard-card[data-period]').forEach((cardEl) => {
        const story = ByeolData.getStory(visit, cardEl.dataset.period, '종합');
        const textEl = cardEl.querySelector('.dash-card-text');
        if (!story) { console.error('[#15] 종합 이야기 없음:', cardEl.dataset.period); textEl.textContent = ''; return; }
        textEl.textContent = story.notOpen ? story.message : story.brief;
      });
      const today = ByeolData.getStory(visit, 'today', '종합');
      // 오늘의 기운 = 이 관람객의 날짜(#6에서 정함)·오늘·종합의 fortune 그대로. 데이터가 없으면 임의의 값을 넣지 않고 비워 둔다
      document.getElementById('dashFlow').textContent = today && today.flow ? today.flow : '—';
    })();

    const T = TIMELINE.page15;
    const clock = UnitySync.clock(T.video, T.fallback);
    const SPREAD_AT = 0;         // 스크린: 점술가가 손을 내리고 별빛·운세 요소가 가장자리로 퍼짐, 카메라 초점이 점술가로

    // 점술가 나래이션: 두 번째 대사("정리해 드리겠습니다")와 함께 퍼진 요소가 중앙으로 모이기 시작한다
    const LINES = T.lines;
    const GATHER_AT = LINES[1].at;   // 스크린: 퍼진 요소가 점술가 쪽 중앙으로 모이기 시작
    const SHOW_AT = T.showAt;        // 총정리 화면이 나타나는 시각
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    lockInput();
    const screenEl = document.getElementById('screen');
    const nextBtn = document.getElementById('nextBtn');
    // 시연 후 내레이션 자막은 화면에 띄우지 않는다 (playSubtitlesAt에 null → 대사 시각만 흘려보내 그 시각에 맞춘 어두운 막·버튼은 그대로)
    playSubtitlesAt(null, LINES, clock);
    const shown = clock.at(SHOW_AT).then(() => {
      screenEl.classList.add('phase-show');
      console.info('[#15] 총정리 화면 표시');
    });
    // '다음'은 총정리 화면이 다 나타나고(nextDelay) Unity가 영상 20에 들어간 뒤에야 보이고 눌린다.
    // (영상 19 도중에 눌러도 Unity가 20에 들어가는 순간 21로 넘어가지만, 화면과 영상이 맞도록 20을 기다린다)
    Promise.all([shown.then(() => wait(T.nextDelay)), clock.reach(20)]).then(() => {
      screenEl.classList.add('phase-next');
      unlockInput();
      const s = UnitySync.state();
      console.info('[#15] "다음" 활성화 · Unity', s ? '영상 ' + s.video : (UnitySync.enabled() ? '미연결(타이머로 진행)' : '동기화 끔'));
    });

    // 다음: 총정리 화면이 스르륵 사라지고, 같은 책상 그대로 #16으로 끊김 없이 이어진다
    const EXIT_MS = 1200;
    let advanced = false;
    nextBtn.addEventListener('click', () => {
      if (advanced) return;
      if (inputLocked) { console.warn('[#15] "다음"이 아직 잠겨 있어 무시함 (영상 20 대기 중)'); return; }
      advanced = true;
      console.info('[#15] "다음" 클릭 → summary_next 전송, #16으로');
      sendUnityAction('summary_next');   // 영상 20 → 21 (한 번만)
      lockInput();
      screenEl.classList.add('phase-exit');
      setTimeout(() => goToInPlace('page16_gift_card.html'), EXIT_MS);
    });

    showScreenNotes([
      { at: -650, text: '(#14에서 "이야기 마치기" 직후, 영상 19) 관람객의 운세 색·밝기를 띠던 별자리 그래픽이 본래의 밝은 빛으로 돌아감 · 태블릿: #14의 요소가 스르륵 사라짐' },
      { at: SPREAD_AT, text: '점술가가 손을 자연스럽게 내리며, 별빛과 운세 요소가 화면 가장자리로 은은하게 퍼짐. 카메라 초점이 별자리에서 점술가로 부드럽게 옮겨감 (등 뒤 창밖 밤하늘에는 관람객의 별자리와 별빛이 반짝임) · 태블릿: 어두운 책상, 입력 잠금' },
      ...cueNotes(LINES, '점술가 나래이션').map((n, i) => (i === 1
        ? { at: n.at, text: n.text + ' · 퍼졌던 별빛과 운세 요소가 점술가의 몸·손이 있는 중앙으로 자연스럽게 모여듦' }
        : { at: n.at, text: n.text + ' · 태블릿: 어두운 책상 위 자막' })),
      { at: SHOW_AT, text: '중앙으로 다 모임 · 태블릿: 어두운 책상 위로 운세 총정리 화면이 나타남' },
      { at: clock.noteTime(20, 0), text: '영상 20 루프: 연기가 일렁이고 별빛이 반짝임 · 태블릿: "다음" 버튼 (총정리가 뜨고 2초가 지나야. 누르면 영상 21, 태블릿 #16)' },
    ], { videoStart: clock.sceneStart, total: clock.noteTime(20, 2000), waitInput: true });
  </script>
</body>
</html>
