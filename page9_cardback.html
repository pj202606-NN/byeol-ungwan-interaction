<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>28수 - #9 별자리 카드</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <div class="screen bg-room">
    <div class="card-object card-drop" style="width:340px; height:480px; margin-bottom:56px;"></div>
    <button class="btn" style="z-index:2;" onclick="goTo('page10_carddetail.html')">나의 별자리 확인하기</button>
    <div class="page-index">#9 page9_cardback</div>
  </div>

  <script>
    // 유니티 연동 테스트: 이 페이지에 들어오면 지정된 영상을 재생하라는
    // 신호만 보낸다. 'card_reveal'은 임시 식별자이니 실제 유니티 쪽
    // VideoClip 이름/키에 맞춰 바꿔주면 됨.
    // 로컬 서버가 없는 환경(정적 호스팅 등)에서는 연결이 막히므로 조용히 건너뛴다.
    try {
      const ws = new WebSocket(`ws://${location.hostname}:3000`);
      ws.onopen = () => {
        console.log('서버 연결됨');
        ws.send(JSON.stringify({ type: 'play_video', video: 'card_reveal' }));
      };
    } catch (e) {
      console.log('영상 서버 연결 없이 진행:', e.message);
    }
  </script>
</body>
</html>
