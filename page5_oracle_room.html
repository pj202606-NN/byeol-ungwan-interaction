<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #5 별운관</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: 연기가 대문 안으로 들어감 → 별운관의 문이 열림 → 내부 전경 → 카메라가 책상 앞에 멈춤
            → 연기가 모여 점술가 등장 → 점술가의 설명
    태블릿: 어두운 대기(입력 잠금) → 점술가의 연기가 모이기 시작하면 어두운 책상 화면 → 설명 자막 → 어두운 책상 그대로 #6으로
    밝기는 .room-shade(oracle.css)의 불투명도로 조절한다. (dark → dim, 원래 밝기로는 #6에서 종이가 내려올 때)
  */
  /* 어두운 대기 동안만 보이는 흐릿한 파티클 (#4에서 이어지는 느낌) */
  .shade-haze {
    position: absolute;
    inset: 0;
    z-index: 2;
    transition: opacity 2.5s ease-in-out;
  }
  .phase-desk .shade-haze,
  .phase-bright .shade-haze { opacity: 0; }

  .guide-subtitle { z-index: 3; }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/timeline.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade"></div>
    <div class="shade-haze" id="haze"></div>
    <div class="guide-subtitle" id="subtitle"></div>
    <div class="page-index">#5 page5_oracle_room</div>
  </div>

  <script>
    // 시각은 영상 02의 재생 시각(ms). 값과 자막은 js/timeline.js의 TIMELINE.page5에서 조절한다.
    const T = TIMELINE.page5;
    const clock = UnitySync.clock(T.video, T.fallback);
    const DESK_AT = T.deskAt;     // 점술가의 연기가 모이기 시작 · 태블릿: 어두운 책상 화면이 드러남
    const NEXT_AT = T.nextAt;     // 태블릿 #6으로 이어짐 (마지막 자막이 다 사라진 순간)
    const CROSSFADE = 900;        // 이 화면을 같은 어두운 책상의 #6 화면 위에서 서서히 걷어 낸다
    const LINES = T.lines;

    lockInput();
    spawnHaze(document.getElementById('haze'), 28);

    const screenEl = document.getElementById('screen');
    const subtitle = document.getElementById('subtitle');

    clock.at(DESK_AT).then(() => screenEl.classList.add('phase-desk'));
    playSubtitlesAt(subtitle, LINES, clock);
    clock.at(NEXT_AT).then(() => goToInPlace('page6_birth_paper.html', { crossfade: CROSSFADE }));

    showScreenNotes([
      { at: clock.sceneStart, text: '연기가 대문 안으로 들어가고, 별운관의 모습이 드러남 · 태블릿: 어두운 대기' },
      { at: T.doorOpenAt, text: '별운관의 문이 열리기 시작 → 안으로 들어서 메인 장소 전경(정면의 열린 큰 창, 그 앞의 좌식 책상. 한옥 내부, 밤) → 카메라가 책상 앞에 멈춤' },
      { at: DESK_AT, text: '하늘거리는 천 같은 연기가 책상 너머로 모여들기 시작 · 태블릿: 어두운 책상 화면' },
      { at: T.figureAt, text: '연기가 사람 형태를 이루어 점술가가 완전히 등장' },
      ...cueNotes(LINES, '점술가'),
      { at: NEXT_AT, text: '설명 끝 · 태블릿: 어두운 책상 그대로 #6으로 끊김 없이 이어짐 (밝아지는 것은 #6에서 종이가 내려올 때)' },
    ], { videoStart: clock.sceneStart, total: NEXT_AT });
  </script>
</body>
</html>
