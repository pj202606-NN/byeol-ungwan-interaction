<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #12 키워드 선택</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: #11 마지막 루프(펼친 손 사이 별자리·별빛 반짝임)가 계속 이어짐
    태블릿: 긴 카드 6장이 위에서 스르륵 내려옴 → 안내 문장이 뜸
            → 카드 하나를 누르면 선택 효과(더 내려오며 빛남, 나머지는 어두워짐)를 잠깐 보여 준 뒤 자동으로 진행 (2026-11-16, '해석 보기' 버튼 없앰)
            → 문장이 사라지고 긴 카드가 다시 위로 올라간 뒤, 같은 책상 그대로 #13으로 이어짐
  */
  /* 긴 카드가 화면 위에서 차례로 내려온다 */
  @keyframes columnDrop {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .tag-column {
    animation: columnDrop 1.2s cubic-bezier(.22,.61,.36,1) both;
  }
  .tag-column:nth-child(1) { animation-delay: 0s; }
  .tag-column:nth-child(2) { animation-delay: 0.08s; }
  .tag-column:nth-child(3) { animation-delay: 0.16s; }
  .tag-column:nth-child(4) { animation-delay: 0.24s; }
  .tag-column:nth-child(5) { animation-delay: 0.32s; }
  .tag-column:nth-child(6) { animation-delay: 0.4s; }

  /* ---------- 키워드 종이 (images/keyword-paper.png 한 장을 6칸에 재사용, 1024×1536, 종이 밖은 투명) ----------
     이미지 속 종이는 (398,27)~(647,1496) 부분(249×1469)이다. 그 부분만 칸에 꼭 맞게 보이도록 배경 크기·위치를
     이미지 1px의 화면 크기(--kw-px) 단위로 맞추므로 비율은 원본 그대로 유지된다.
     높이는 예전 칸과 같은 740px(--kw-h), 폭은 비율에 따라 약 125px, 칸 중심 사이 간격은 예전과 같은 246px.
     칸(.tag-column) 자체가 종이 그림이라 터치·선택 판정과 글씨가 종이와 함께 움직인다.
     예전 회색 칸의 배경·테두리·그림자(oracle.css)는 이 장면에서만 끈다 */
  /* (2026-11-19) 종이 아랫면(740px)은 그대로 두고 위쪽으로 100px 더 길게 (원래 비율 그대로 키우므로 폭도 함께 넓어진다).
     태블릿(16:10)에서는 16:9 화면 위에 검은 여백이 생겨 종이 윗부분이 잘린 듯 보였으므로, 종이가 그 여백까지 이어지게
     이 화면만 .screen 밖으로 그릴 수 있게 한다 (배경은 그대로 .screen 안) */
  #screen { overflow: visible; }
  .tag-columns {
    top: -100px;
    --kw-h: 840px;
    --kw-px: calc(var(--kw-h) / 1469);
    --kw-w: calc(var(--kw-px) * 249);
    gap: calc(246px - var(--kw-w));
  }
  .tag-column {
    width: var(--kw-w);
    height: var(--kw-h);
    background: url('images/keyword-paper.png') no-repeat;
    background-size: calc(var(--kw-px) * 1024) calc(var(--kw-px) * 1536);
    background-position: calc(var(--kw-px) * -398) calc(var(--kw-px) * -27);
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));   /* 종이 윤곽을 따라 생기는 그림자 */
    transform-origin: 50% 0;
  }
  .tag-label { color: #3b2c1e; }

  /* 선택한 종이: 예전처럼 윗부분은 화면 위에 붙은 채 740 → 780px로 더 내려오고(scale, 비율 유지) 가장자리가 밝게 빛난다.
     하나를 고르면 나머지 종이는 어두워져 차이가 분명히 보인다.
     (등장·퇴장 애니메이션이 transform을 쓰므로, 겹치지 않는 scale 속성으로 늘린다) */
  .tag-column {
    transition: scale 0.45s cubic-bezier(.22,.61,.36,1), filter 0.3s ease;
  }
  .tag-column.selected {
    scale: calc(880 / 840);   /* 예전처럼 아랫면이 40px 더 내려온다 */
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 18px rgba(255,240,205,0.6)) drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }
  .has-topic .tag-column:not(.selected) {
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)) brightness(0.6);
  }

  /* 안내 문장: 카드가 다 내려온 뒤 등장 */
  .topic-caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 840px;
    margin: 0;
    text-align: center;
    z-index: 2;
  }
  .topic-caption {
    opacity: 0;
    transition: opacity 1s ease;
  }
  .phase-ready .topic-caption { opacity: 1; }
  /* 카드를 고른 뒤: 문장이 사라지고, 긴 카드가 내려왔던 것처럼 다시 위로 올라간다 */
  @keyframes columnRise {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100%); opacity: 0; }
  }
  .phase-exit .tag-column { animation: columnRise 1.1s cubic-bezier(.55,0,.75,.2) both; }
  .phase-exit .tag-column:nth-child(1) { animation-delay: 0.4s; }
  .phase-exit .tag-column:nth-child(2) { animation-delay: 0.48s; }
  .phase-exit .tag-column:nth-child(3) { animation-delay: 0.56s; }
  .phase-exit .tag-column:nth-child(4) { animation-delay: 0.64s; }
  .phase-exit .tag-column:nth-child(5) { animation-delay: 0.72s; }
  .phase-exit .tag-column:nth-child(6) { animation-delay: 0.8s; }
  .phase-exit .topic-caption,
  .phase-exit #backBtn { opacity: 0 !important; transition: opacity 0.5s ease; pointer-events: none; }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/timeline.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <button class="corner-btn" id="backBtn">뒤로가기</button>

    <div class="tag-columns">
      <div class="tag-column" data-topic="종합"><span class="tag-label">종합</span></div>
      <div class="tag-column" data-topic="금전"><span class="tag-label">금전</span></div>
      <div class="tag-column" data-topic="애정"><span class="tag-label">애정</span></div>
      <div class="tag-column" data-topic="직장"><span class="tag-label">직장</span></div>
      <div class="tag-column" data-topic="학업"><span class="tag-label">학업</span></div>
      <div class="tag-column" data-topic="관계"><span class="tag-label">관계</span></div>
    </div>
    <div class="subtitle text-light topic-caption">듣고 싶은 이야기를 선택해 주세요.</div>
    <div class="page-index">#12 page12_keyword_select</div>
  </div>

  <script>
    // 타이밍 (단위: ms)
    const READY_AT = 1900;   // 긴 카드 6장이 다 내려온 뒤(1.2초 + 마지막 카드 시차 0.4초) 안내 문장 등장
    const SELECT_HOLD = 700; // 카드를 누른 뒤 자동 진행까지: 선택 효과(scale 0.45초·빛 0.3초 transition)가 다 보이고 잠깐 머무를 만큼

    // 안내 문장과 카드 선택은 Unity가 영상 16(키워드 선택 대기 루프)에 들어간 뒤에 (js/timeline.js의 TIMELINE.page12)
    // #14의 '다른 이야기 듣기'로 다시 온 경우 Unity는 이미 그 뒤(영상 18)에 있으므로 바로 뜬다
    const T = TIMELINE.page12;
    const clock = UnitySync.clock(T.video, T.fallback);

    lockInput();
    const screenEl = document.getElementById('screen');
    Promise.all([new Promise((r) => setTimeout(r, READY_AT)), clock.reach(16)]).then(() => {
      screenEl.classList.add('phase-ready');
      unlockInput();
    });

    // 카드 하나를 누르면: 선택 효과(그 카드는 더 내려오며 빛나고 나머지는 어두워짐) → SELECT_HOLD 뒤 자동으로 진행.
    // 첫 선택 뒤에는 입력을 잠가, 같은 카드를 연달아 누르거나 다른 카드를 눌러도 진행·interpret 전송·#13 이동은 한 번뿐이다.
    // (#14 '다른 이야기 듣기'로 돌아오면 이 페이지를 새로 열므로 다시 고를 수 있다)
    const columns = document.querySelectorAll('.tag-column');
    let topic = null;
    columns.forEach((col) => {
      col.addEventListener('click', () => {
        if (topic) return;
        topic = col.dataset.topic;
        lockInput();
        columns.forEach((c) => c.classList.toggle('selected', c === col));
        screenEl.classList.add('has-topic');
        setTimeout(proceed, SELECT_HOLD);
      });
    });

    const EXIT_MS = 2100;   // 문장이 사라지고(0.5초) 긴 카드가 다 올라갈 때까지(마지막 카드 0.8초 + 1.1초 + 여유)
    // 키워드를 고르는 순간이 아니라 자동 진행이 시작될 때 interpret(영상 16 → 17)을 보낸다
    // (예전 '해석 보기'를 누른 순간과 같은 자리: 퇴장 연출·#13과 Unity 영상 17의 시간 관계는 그대로)
    let proceeded = false;
    function proceed() {
      if (proceeded) return;
      proceeded = true;
      sendUnityAction('interpret');
      try { sessionStorage.setItem('fortuneTopic', topic); } catch (err) {}
      screenEl.classList.add('phase-exit');
      setTimeout(() => goToInPlace('page13_fortune_reading.html'), EXIT_MS);
    }
    // 체험용 뒤로가기: #11의 카드 선택 화면으로 (처음부터가 아니라)
    document.getElementById('backBtn').addEventListener('click', () => goTo('page11_fortune_select.html?ready'));

    showScreenNotes([
      { at: 0, text: '#11 마지막 루프가 계속 이어짐: 어깨 너비로 펼친 손 사이에서 별자리·별빛이 안개와 함께 반짝임 · 태블릿: 긴 카드 6장이 위에서 차례로 내려옴' },
      { at: READY_AT, text: '같은 루프 유지. 관람객이 카드 하나를 고를 때까지 반복 (고르면 선택 효과 ' + SELECT_HOLD / 1000 + '초 뒤 자동으로 #13으로) · 태블릿: 안내 문장이 뜸' },
    ], { total: READY_AT, waitInput: true });
  </script>
</body>
</html>
