<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #12 키워드 선택</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: #11 마지막 루프(펼친 손 사이 별자리·별빛 반짝임)가 계속 이어짐
    태블릿: 긴 카드 6장이 위에서 스르륵 내려옴 → 안내 문장과 '해석 보기' 버튼이 뜸
            → 카드는 한 번에 하나만 선택, 하나를 고른 뒤 '해석 보기'를 눌러야 #13으로
            → '해석 보기'를 누르면 문장·버튼이 사라지고 긴 카드가 다시 위로 올라간 뒤, 같은 책상 그대로 #13으로 이어짐
  */
  /* 긴 카드가 화면 위에서 차례로 내려온다 */
  @keyframes columnDrop {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .tag-column {
    animation: columnDrop 1.2s cubic-bezier(.22,.61,.36,1) both;
  }
  .tag-column:nth-child(1) { animation-delay: 0s; }
  .tag-column:nth-child(2) { animation-delay: 0.08s; }
  .tag-column:nth-child(3) { animation-delay: 0.16s; }
  .tag-column:nth-child(4) { animation-delay: 0.24s; }
  .tag-column:nth-child(5) { animation-delay: 0.32s; }
  .tag-column:nth-child(6) { animation-delay: 0.4s; }

  /* 선택한 카드: 천(긴 종이)처럼 윗부분은 화면 위에 붙은 채 길이만 늘어나 더 내려오고, 테두리가 밝게 빛난다 */
  .tag-column {
    transition: height 0.45s cubic-bezier(.22,.61,.36,1), border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .tag-column.selected {
    height: 780px;
    border-color: #fff;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.6), 0 0 22px rgba(255,255,255,0.45), 0 3px 8px rgba(0,0,0,0.16);
  }

  /* 안내 문장과 해석 보기 버튼: 카드가 다 내려온 뒤 등장 */
  .topic-caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 840px;
    margin: 0;
    text-align: center;
    z-index: 2;
  }
  .topic-caption,
  #interpretBtn {
    opacity: 0;
    transition: opacity 1s ease;
  }
  .phase-ready .topic-caption { opacity: 1; }
  #interpretBtn {
    position: absolute;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;
  }
  /* 카드를 고르기 전까지는 흐리게, 고르면 또렷하게 + 누를 수 있게 */
  .phase-ready #interpretBtn { opacity: 0.35; }
  /* 카드를 고르면 버튼이 확실히 '누를 수 있는' 상태로 밝아진다 */
  #interpretBtn {
    transition: opacity 1s ease, color 0.3s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
  }
  /* '해석 보기' 이후: 문장·버튼이 사라지고, 긴 카드가 내려왔던 것처럼 다시 위로 올라간다 */
  @keyframes columnRise {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100%); opacity: 0; }
  }
  .phase-exit .tag-column { animation: columnRise 1.1s cubic-bezier(.55,0,.75,.2) both; }
  .phase-exit .tag-column:nth-child(1) { animation-delay: 0.4s; }
  .phase-exit .tag-column:nth-child(2) { animation-delay: 0.48s; }
  .phase-exit .tag-column:nth-child(3) { animation-delay: 0.56s; }
  .phase-exit .tag-column:nth-child(4) { animation-delay: 0.64s; }
  .phase-exit .tag-column:nth-child(5) { animation-delay: 0.72s; }
  .phase-exit .tag-column:nth-child(6) { animation-delay: 0.8s; }
  .phase-exit .topic-caption,
  .phase-exit #interpretBtn,
  .phase-exit #backBtn { opacity: 0 !important; transition: opacity 0.5s ease; pointer-events: none; }

  .phase-ready.has-topic #interpretBtn {
    opacity: 1;
    pointer-events: auto;
    color: #f2f2f2;
    border-color: #e8e8e8;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 16px rgba(255,255,255,0.28);
  }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <div class="screen bg-room" id="screen">
    <button class="corner-btn" id="backBtn">뒤로가기</button>

    <div class="tag-columns">
      <div class="tag-column" data-topic="종합"><span class="tag-label">종합</span></div>
      <div class="tag-column" data-topic="금전"><span class="tag-label">금전</span></div>
      <div class="tag-column" data-topic="애정"><span class="tag-label">애정</span></div>
      <div class="tag-column" data-topic="직장"><span class="tag-label">직장</span></div>
      <div class="tag-column" data-topic="학업"><span class="tag-label">학업</span></div>
      <div class="tag-column" data-topic="관계"><span class="tag-label">관계</span></div>
    </div>
    <div class="subtitle topic-caption">듣고 싶은 이야기를 선택해 주세요.</div>
    <button class="btn" id="interpretBtn">해석 보기</button>
    <div class="page-index">#12 page12_keyword_select</div>
  </div>

  <script>
    // 타이밍 (단위: ms)
    const READY_AT = 1900;   // 긴 카드 6장이 다 내려온 뒤(1.2초 + 마지막 카드 시차 0.4초) 안내 문장과 버튼 등장

    lockInput();
    const screenEl = document.getElementById('screen');
    setTimeout(() => {
      screenEl.classList.add('phase-ready');
      unlockInput();
    }, READY_AT);

    // 카드는 한 번에 하나만 선택: 다른 카드를 누르면 이전 선택은 해제되고, 선택한 카드를 다시 누르면 해제된다
    const columns = document.querySelectorAll('.tag-column');
    let topic = null;
    columns.forEach((col) => {
      col.addEventListener('click', () => {
        const deselect = col.classList.contains('selected');
        columns.forEach((c) => c.classList.toggle('selected', !deselect && c === col));
        topic = deselect ? null : col.dataset.topic;
        screenEl.classList.toggle('has-topic', !deselect);
      });
    });

    const EXIT_MS = 2100;   // 문장·버튼이 사라지고(0.5초) 긴 카드가 다 올라갈 때까지(마지막 카드 0.8초 + 1.1초 + 여유)
    document.getElementById('interpretBtn').addEventListener('click', (e) => {
      if (!topic) return;
      e.currentTarget.disabled = true;
      try { sessionStorage.setItem('fortuneTopic', topic); } catch (err) {}
      lockInput();
      screenEl.classList.add('phase-exit');
      setTimeout(() => goToInPlace('page13_fortune_reading.html'), EXIT_MS);
    });
    // 체험용 뒤로가기: #11의 카드 선택 화면으로 (처음부터가 아니라)
    document.getElementById('backBtn').addEventListener('click', () => goTo('page11_fortune_select.html?ready'));

    showScreenNotes([
      { at: 0, text: '#11 마지막 루프가 계속 이어짐: 어깨 너비로 펼친 손 사이에서 별자리·별빛이 안개와 함께 반짝임 · 태블릿: 긴 카드 6장이 위에서 차례로 내려옴' },
      { at: READY_AT, text: '같은 루프 유지. 관람객이 카드 하나를 고르고 "해석 보기"를 누를 때까지 반복 (누르면 #13으로) · 태블릿: 안내 문장과 "해석 보기" 버튼이 뜸' },
    ], { total: READY_AT, waitInput: true });
  </script>
</body>
</html>
