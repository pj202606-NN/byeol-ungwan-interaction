<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #17 QR 코드</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린: #16 마지막과 같은 작별 대기 루프 ('떠나기'를 누를 때까지)
    태블릿: (#16의 책상·카드에서 끊김 없이 이어짐) 가운데 카드가 뒤집히며 QR 코드 면이 나타남
            → 안내 문장과 '떠나기' 버튼 → #18
  */
  /* #16의 카드와 같은 자리·같은 크기 (가운데, 아래 버튼만큼 위로 올라간 자리) */
  .flip-card {
    position: absolute;
    left: 790px;
    top: 263px;   /* #16 카드와 같은 자리 (2026-11-19 242 → 263, #16 .card-stack top 24px에 맞춰 잰 값) */
    width: 340px;
    height: 480px;
    perspective: 1800px;
    z-index: 2;
    opacity: 1;
    transition: opacity 1s ease-in-out;
  }
  .phase-leave .flip-card { opacity: 0; pointer-events: none; }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1.3s cubic-bezier(.45,.05,.2,1);
  }
  .phase-flip .flip-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flip-back { transform: rotateY(180deg); }
  /* 뒤집힌 면 = 카드 뒷면 이미지(맨 아래 층) + 이 관람객 별자리의 QR(.qr-slot, 그 위 층, 카드 가운데. assets/qr/qr_NN.svg).
     QR은 SVG를 문서 안에 넣어 모듈만 카드 금색(--qr-ink), 바탕은 카드와 같은 남색(--qr-paper)으로 칠한다 (css/oracle.css, 흰 바탕 없음).
     원본 SVG에 있는 여백(2칸) 바깥으로 같은 남색을 10px(약 2칸) 더 깔아, 카드 장식과 QR 사이 인식용 여백을 약 4칸으로.
     .flip-back이 미리 rotateY(180deg)로 돌아가 있어, 다 뒤집힌 뒤에는 이미지·QR이 좌우 반전 없이 보인다.
     QR에는 투명도·블렌딩을 쓰지 않는다. 불러오지 못하면 비어 있어 아무것도 보이지 않는다 */
  .flip-back .qr-slot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    padding: 10px;
    box-sizing: border-box;
    background: var(--qr-paper);
    border-radius: 2px;
    z-index: 1;
  }
  .flip-back .qr-slot:empty { display: none; }
  .flip-back .qr-slot svg { display: block; width: 100%; height: 100%; }
  .flip-back .qr-slot svg > rect:first-child { fill: var(--qr-paper); }
  .flip-back .qr-slot svg g[style] { fill: var(--qr-ink) !important; }

  .qr-caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 170px;
    margin: 0;
    text-align: center;
    z-index: 2;
  }
  .qr-caption,
  #leaveBtn {
    opacity: 0;
    transition: opacity 1s ease;
  }
  #leaveBtn {
    position: absolute;
    left: 50%;
    top: 830px;   /* 카드와의 간격을 넓혀 아래로 (예전 778, #16의 버튼 자리) */
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;
  }
  .phase-ready .qr-caption,
  .phase-ready #leaveBtn { opacity: 1; }
  .phase-ready #leaveBtn { pointer-events: auto; transition-delay: 0.3s; }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/byeol-data.js"></script>
  <script src="js/ambient.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="subtitle text-light qr-caption">별 이야기를 간직하려면 QR코드를 스캔하세요.</div>
    <div class="flip-card">
      <div class="flip-inner">
        <div class="card-object flip-face flip-front"></div>
        <div class="card-object flip-face flip-back has-card-art"><img class="card-art" src="assets/cards/card_back.jpg" alt="" draggable="false"><div class="qr-slot" id="qrSlot"></div></div>
      </div>
    </div>
    <button class="btn btn-light" id="leaveBtn">떠나기</button>
    <div class="page-index">#17 page17_qr</div>
  </div>

  <script>
    // 타이밍 (단위: ms)
    const FLIP_AT = 500;      // #16에서 이어진 뒤 카드가 뒤집히기 시작
    const FLIP_MS = 1300;     // 뒤집히는 시간 (.flip-inner transition)
    const READY_AT = FLIP_AT + FLIP_MS - 300;  // 안내 문장과 '떠나기' 버튼 등장 (카드가 다 뒤집히기 0.3초 전. 시연 후 0.5초 앞당김, 예전 +200)
    const UNLOCK_AT = READY_AT + 1000;

    // 앞뒤 모두 공통 카드 뒷면 이미지. 뒤집힌 면에는 이 관람객 별자리(#6에서 정한 ID)의 QR (assets/qr/qr_NN.svg)
    const visit = ByeolData.requireVisit();
    if (visit) {
      ByeolData.fillCardBack(document.querySelector('.flip-front'));   // #16에서 내려온 카드 = 공통 뒷면
      ByeolData.fillQr(document.getElementById('qrSlot'), visit.mansionId);   // #16에서 미리 받아 두어 뒤집히기 전에 들어간다
    }

    lockInput();
    const screenEl = document.getElementById('screen');
    setTimeout(() => screenEl.classList.add('phase-flip'), FLIP_AT);
    setTimeout(() => screenEl.classList.add('phase-ready'), READY_AT);
    setTimeout(unlockInput, UNLOCK_AT);

    // 떠나기: QR 카드·문장·버튼이 1초에 걸쳐 사라진 뒤, 같은 책상의 #18로 이어진다
    document.getElementById('leaveBtn').addEventListener('click', (e) => {
      if (e.currentTarget.disabled) return;
      sendUnityAction('leave');   // 영상 22 → 23
      e.currentTarget.disabled = true;
      lockInput();
      screenEl.classList.remove('phase-ready');
      screenEl.classList.add('phase-leave');
      setTimeout(() => goToInPlace('page18_farewell.html'), 1000);
    });

    showScreenNotes([
      { at: 0, text: '#16 마지막과 같은 작별 대기 루프가 이어짐 · 태블릿: 가운데 카드가 뒤집히며 QR 코드 면이 나타남' },
      { at: UNLOCK_AT, text: '같은 대기 루프. 관람객이 QR을 스캔하고 "떠나기"를 누를 때까지 반복 (누르면 #18로) · 태블릿: 안내 문장과 "떠나기" 버튼' },
    ], { total: UNLOCK_AT, waitInput: true });
  </script>
</body>
</html>
