<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #4 연기를 따라 대문으로</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린 연출(음파가 흩어짐 → 연기가 모임 → 연기 궤적을 따라 한국풍 대문 안으로 진입) 동안
    태블릿은 입력을 잠그고, 별빛과 색감만 단계별로 바뀐다.
    단계는 .screen에 붙는 phase-* 클래스로 전환되고, 시점은 아래 스크립트의 PHASES에서 조절한다.
  */
  .field {
    position: absolute;
    inset: 0;
    transform: scale(1);
    transition: transform 3s ease-in-out, filter 3s ease-in-out;
  }
  .tint {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease-in-out;
  }
  .tint-cool {
    background: radial-gradient(ellipse at 50% 45%, rgba(90,110,170,0.16) 0%, rgba(0,0,0,0) 70%);
  }
  .tint-violet {
    background: radial-gradient(ellipse at 50% 50%, rgba(150,120,200,0.18) 0%, rgba(40,30,80,0.12) 45%, rgba(0,0,0,0) 75%);
  }
  .gate-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 900px;
    height: 900px;
    margin: -450px 0 0 -450px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,205,150,0.32) 0%, rgba(200,150,100,0.12) 35%, rgba(0,0,0,0) 70%);
    filter: blur(20px);
    opacity: 0;
    transform: scale(0.2);
    transition: opacity 2.5s ease-in, transform 2.5s ease-in;
  }

  /* 1. 흩어짐: #3의 차분한 푸른 우주 그대로 */
  .phase-scatter .tint-cool { opacity: 1; }

  /* 2. 연기가 모임: 시야가 살짝 안쪽으로 모이고 보랏빛이 돈다 */
  .phase-gather .field { transform: scale(0.88); filter: brightness(1.15); }
  .phase-gather .tint-cool { opacity: 0.5; }
  .phase-gather .tint-violet { opacity: 1; }

  /* 3. 연기 궤적을 따라 진입: 별빛이 바깥으로 밀려나며 점점 빨라진다 (연기 1인칭) */
  .phase-rush .field {
    transform: scale(1.8);
    filter: brightness(1.5);
    transition: transform 5s cubic-bezier(.55,0,.85,.55), filter 5s ease-in;
  }
  .phase-rush .tint-violet { opacity: 0.8; }
  .phase-rush .gate-glow { opacity: 0.4; transform: scale(0.45); transition-duration: 5s; }

  /* 4. 대문 안으로: 중앙에서 따뜻한 빛이 번지며 다음 장면으로 */
  .phase-gate .field {
    transform: scale(2.4);
    filter: brightness(1.2);
    transition: transform 2.5s ease-in, filter 2.5s ease-in;
  }
  .phase-gate .tint-violet { opacity: 0.3; }
  .phase-gate .gate-glow { opacity: 1; transform: scale(1.6); }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <div class="screen bg-fade" id="screen">
    <div class="field" id="field">
      <div class="milky-band"></div>
    </div>
    <div class="tint tint-cool"></div>
    <div class="tint tint-violet"></div>
    <div class="gate-glow"></div>
    <div class="page-index">#4 page4_smoke_gate</div>
  </div>

  <script>
    // 임시 구현: 스크린 영상이 나오면 각 단계의 at(ms) 값만 영상의 전환 시점에 맞추면 된다.
    const PHASES = [
      { at: 0,     name: 'scatter', screen: '말하듯 일렁이던 음파가 흩어짐' },
      { at: 2500,  name: 'gather',  screen: '흐르는 연기(은하수 느낌)가 모여듦. 사람 형상·얼굴은 없음' },
      { at: 5500,  name: 'rush',    screen: '연기 1인칭 시점으로 궤적을 따라 한국풍 대문을 향해 날아감 (박진감 있게, 지나치게 빠르지 않게)' },
      { at: 10500, name: 'gate',    screen: '연기가 대문 안으로 흘러 들어감' },
    ];
    const END_AT = 12500;             // 다음 장면(#5)으로 넘어가는 시점

    showScreenNotes([
      ...PHASES.map((p) => ({ at: p.at, text: p.screen })),
      { at: END_AT, text: '태블릿 #5로 전환' },
    ], { total: END_AT + 900 });

    lockInput();
    const field = document.getElementById('field');
    spawnSmoke(field, 6);
    spawnHaze(field, 40);

    const screenEl = document.getElementById('screen');
    PHASES.forEach((phase) => {
      setTimeout(() => {
        PHASES.forEach((p) => screenEl.classList.remove('phase-' + p.name));
        screenEl.classList.add('phase-' + phase.name);
      }, phase.at);
    });

    setTimeout(() => {
      goTo('page5_oracle_room.html', 900);
    }, END_AT);
  </script>
</body>
</html>
