<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #4 연기를 따라 대문으로</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
<style>
  /*
    스크린 연출(음파가 흩어짐 → 연기가 모임 → 연기 궤적을 따라 한국풍 대문 안으로 진입) 동안
    태블릿은 입력을 잠그고, 별빛과 색감만 단계별로 바뀐다.
    단계는 .screen에 붙는 phase-* 클래스로 전환되고, 시점은 아래 스크립트의 PHASES에서 조절한다.
  */
  .field {
    position: absolute;
    inset: 0;
    transform: scale(1);
    transition: transform 3s ease-in-out, filter 3s ease-in-out;
  }
  /* (2026-11-19) 책상 영상 위 검은 막이 천천히 걷히는 동안, 반짝임(.field)만 단계별로 움직인다.
     예전의 푸른·보랏빛 색조와 대문 빛, 은하수·연기는 책상을 가려 뺐다 */
  .field { z-index: 2; pointer-events: none; }
  /* 2. 연기가 모임: 반짝임이 살짝 안쪽으로 모인다 */
  .phase-gather .field { transform: scale(0.88); filter: brightness(1.15); }
  /* 3. 연기 궤적을 따라 진입: 반짝임이 바깥으로 밀려나며 점점 빨라진다 (연기 1인칭) */
  .phase-rush .field {
    transform: scale(1.8);
    filter: brightness(1.5);
    transition: transform 5s cubic-bezier(.55,0,.85,.55), filter 5s ease-in;
  }
  /* 4. 대문 안으로 */
  .phase-gate .field {
    transform: scale(2.4);
    filter: brightness(1.2);
    transition: transform 2.5s ease-in, filter 2.5s ease-in;
  }
</style>
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/desk-video.js"></script>
  <div class="screen bg-room bg-desk" id="screen">
    <div class="room-shade" id="shade"></div>
    <div class="field" id="field"></div>
    <div class="page-index">#4 page4_smoke_gate</div>
  </div>

  <script>
    // 시각은 영상 02의 재생 시각(ms). 각 단계의 시점은 js/timeline.js의 TIMELINE.page4에서 조절한다.
    const T = TIMELINE.page4;
    const clock = UnitySync.clock(T.video, T.fallback);
    DeskVideo.attach();   // #2부터 이어지는 책상 영상
    DeskVideo.dawn(document.getElementById('shade'), clock);   // 검은 막을 계속 아주 천천히 걷는다
    const PHASES = [
      { at: clock.sceneStart, name: 'scatter', screen: '#3 끝에서 어두워진 화면 (잠시 뜸)' },
      { at: T.gatherAt, name: 'gather',  screen: '화면이 다시 밝아지며(페이드 인) 우주에 흐르는 연기(은하수 느낌)가 모여들기 시작. 사람 형상·얼굴은 없음' },
      { at: T.rushAt,   name: 'rush',    screen: '모인 연기가 궤적을 그리며 별운관 대문을 향해 흘러감 (박진감 있게, 지나치게 빠르지 않게)' },
      { at: T.gateAt,   name: 'gate',    screen: '연기가 대문 앞에 다다름 · 태블릿: 중앙에서 따뜻한 빛이 번짐' },
    ];
    const END_AT = T.endAt;           // 다음 장면(#5)으로 넘어가기 시작 (페이드 0.9초 뒤, 연기가 대문 안으로 드는 1:04에 #5 시작)

    showScreenNotes([
      ...PHASES.map((p) => ({ at: p.at, text: p.screen })),
      { at: END_AT, text: '태블릿 #5로 전환' },
    ], { videoStart: clock.sceneStart, total: END_AT + 900 });

    lockInput();
    const field = document.getElementById('field');
    spawnHaze(field, 40);

    const screenEl = document.getElementById('screen');
    PHASES.forEach((phase) => {
      clock.at(phase.at).then(() => {
        PHASES.forEach((p) => screenEl.classList.remove('phase-' + p.name));
        screenEl.classList.add('phase-' + phase.name);
      });
    });

    // 같은 문서에서 #5로 (예전 페이드 0.9초만큼 기다린 뒤 — 시각은 그대로)
    clock.at(END_AT).then(() => setTimeout(() => goToInPlace('page5_oracle_room.html', { crossfade: 900 }), 900));
  </script>
</body>
</html>
