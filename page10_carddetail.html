<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>별운관 체험 - #10 별자리 정보</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/oracle.css">
</head>
<body>
  <script src="js/fit-screen.js"></script>
  <script src="js/nav.js"></script>
  <div class="screen bg-room">
    <button class="corner-btn" style="top:auto; left:auto; right:140px; bottom:90px; background:transparent; border-color:#fff;" onclick="goTo('page11_listen_prompt.html')">다음</button>

    <div class="detail-layout">
      <div class="card-object" style="width:340px; height:480px;">별자리 이미지</div>
      <div class="detail-info">
        <div class="name">별자리 이름</div>
        <div class="row">소속 사신수</div>
        <div class="row">상징 동물</div>
        <div class="row" style="margin-bottom:40px;">성격 키워드</div>
        <button class="accordion-btn" id="toggleBtn" onclick="toggleDetail()">상세 설명 보기</button>
        <div class="accordion-panel" id="detailPanel" style="width:520px;">
          <div class="inner">상세 설명 텍스트</div>
        </div>
      </div>
    </div>
    <div class="page-index">#10 page10_carddetail</div>
  </div>

  <script>
    function toggleDetail() {
      const panel = document.getElementById('detailPanel');
      const btn = document.getElementById('toggleBtn');
      const open = !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      btn.textContent = open ? '상세 설명 닫기' : '상세 설명 보기';
    }
  </script>
</body>
</html>
